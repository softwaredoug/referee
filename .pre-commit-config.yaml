repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: uv run flake8 referee tests
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest (Docker PostgreSQL required)
        entry: uv run --env-file .env pytest
        language: system
        pass_filenames: false
        always_run: true
