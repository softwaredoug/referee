services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-referee}:${POSTGRES_PASSWORD:-referee_dev}@postgres:5432/${POSTGRES_DB:-referee}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-referee}
      POSTGRES_USER: ${POSTGRES_USER:-referee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-referee_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
