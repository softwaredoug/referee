[project]
name = "referee"
version = "0.1.0"
description = "A referee service for search retrieval autoresearch tasks"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115.0",
    "psycopg2-binary>=2.9.10",
    "uvicorn>=0.34.0",
]

[project.scripts]
create-session = "referee.cli.create_session:main"
create-task = "referee.cli.create_task:main"
complete-task = "referee.cli.complete_task:main"
debug-queries = "referee.cli.debug_queries:main"
benchmark-esci-eval = "referee.eval.benchmark:main"
load-judgments = "referee.cli.load_judgments:main"

[dependency-groups]
dev = [
    "flake8>=7.2.0",
    "httpx2>=2.16.2",
    "pre-commit>=4.2.0",
    "pyright>=1.1.400",
    "pytest>=8.3.5",
]
judgments-loader = [
    "cheat-at-search @ git+https://github.com/softwaredoug/cheat-at-search.git@b14065b7174f61acecec6117bf8bf64a4abfa5b8",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["referee"]

[tool.pyright]
include = ["referee"]
pythonVersion = "3.15"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
